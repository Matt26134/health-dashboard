<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10131b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Health & Performance</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="app-icon-192.png">
  <link rel="apple-touch-icon" href="app-icon-192.png">
  <link rel="stylesheet" href="styles.css?v=1.4.0">
</head>
<body>
  <div id="appShell" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">HEALTH & PERFORMANCE</div>
        <h1 id="pageTitle">Today</h1>
      </div>
      <div class="topbar-actions">
        <button id="quickAddButton" class="icon-button" aria-label="Quick add" title="Quick add">＋</button>
        <button id="settingsButton" class="icon-button" aria-label="Settings" title="Settings">⚙</button>
      </div>
    </header>

    <main id="app" class="app-content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-view="today"><span class="nav-icon">⌂</span><span>Today</span></button>
      <button class="nav-item" data-view="progress"><span class="nav-icon">↗</span><span>Progress</span></button>
      <button class="nav-item" data-view="running"><span class="nav-icon">◒</span><span>Training</span></button>
      <button class="nav-item" data-view="learn"><span class="nav-icon">◇</span><span>Learn</span></button>
      <button class="nav-item" data-view="more"><span class="nav-icon">•••</span><span>More</span></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>


  <script>
    window.__healthBootComplete=false;
    window.__healthStartupError='';
    window.addEventListener('error', function(e){ window.__healthStartupError = (e.error && (e.error.stack || e.error.message)) || e.message || 'JavaScript error'; });
    window.addEventListener('unhandledrejection', function(e){ var r=e.reason; window.__healthStartupError = (r && (r.stack || r.message)) || String(r || 'Unhandled promise rejection'); });
    setTimeout(function(){
      if(window.__healthBootComplete) return;
      var app=document.getElementById('app');
      if(!app || app.textContent.trim()) return;
      var msg=window.__healthStartupError || 'Startup did not complete within 5 seconds. This can happen if stale cached files or another open tab blocks the local database.';
      app.innerHTML='<section class="card" style="margin-top:20px"><div class="metric-label">STARTUP RECOVERY</div><h2>The app has not finished loading</h2><p>Your local data has not been deleted.</p><div class="notice warning"><strong>Technical detail</strong><br><code style="white-space:pre-wrap;word-break:break-word"></code></div><p>Close any other Health Dashboard tabs/windows, then tap retry.</p><button class="primary-btn wide" id="startupRetry">Retry with fresh app files</button></section>';
      var code=app.querySelector('code'); if(code) code.textContent=msg;
      var btn=document.getElementById('startupRetry'); if(btn) btn.onclick=function(){ location.href='./?recover='+Date.now(); };
    },5000);
  </script>

  <script src="polish-v111.js?v=1.4.0"></script>
  <script src="polish-v112.js?v=1.4.0"></script>
  <script src="polish-v114.js?v=1.4.0"></script>
  <script src="experience-v120.js?v=1.4.0"></script>
  <script src="motivation-v130.js?v=1.4.0"></script>
  <script src="experience-v130.js?v=1.4.0"></script>
  <script src="personal-coach-v140.js?v=1.4.0"></script>
</body>
